name: Supabase 保活（防休眠）

# 每 6 小时 ping 一次，保证「每天都有足够用户活动」，避免免费项目因 7 天低活动被暂停。
# Supabase 官方要求：过去 7 天每天都要有几次用户数据库请求，每 3 天一次是不够的。

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时一次（每天 4 次）
  workflow_dispatch:

env:
  SUPABASE_URL: https://ydigkfhgbyjxzufnhadd.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_pjGswyzJ4nQeXXRtb8dkbg_KKiRtTtd

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: 访问 Supabase 保持活跃
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/learning_records?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --max-time 25)
          echo "Supabase 响应码: $code"
          if [ "$code" = "200" ]; then
            echo "✅ 项目保持活跃"
          else
            echo "⚠️ 响应异常($code)，项目可能已暂停，请到 Supabase 控制台检查"
          fi
